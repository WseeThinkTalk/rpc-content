Name: qa.rpc
ListenOn: 0.0.0.0:8090
Timeout: 10000
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: qa.rpc
DB:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetime: 3600
Es:
  Addresses:
    - http://localhost:9200/
  Username:
  Password:
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
Prometheus:
  Host: 0.0.0.0
  Port: 9106
  Path: /metrics
Telemetry:
  Endpoint: http://127.0.0.1:14268/api/traces
