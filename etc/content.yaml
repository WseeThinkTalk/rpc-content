Name: content.rpc
ListenOn: 0.0.0.0:9090
Timeout: 10000
Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: content.rpc
DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
DB:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
  MaxOpenConns: 10
  MaxIdleConns: 100
  MaxLifetime: 3600
CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Pass: ${REDIS_PASS}
    Type: node
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
UserRPC:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000
TagRPC:
  Endpoints:
    - 127.0.0.1:9090
  NonBlock: true
  Timeout: 5000
Es:
  Addresses:
    - http://${ES_HOST:127.0.0.1}:${ES_PORT:9200}
  Username: ${ES_USER:}
  Password: ${ES_PASS:}
