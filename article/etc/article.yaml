Name: article.rpc
ListenOn: 0.0.0.0:9090
Timeout: 10000
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: article.rpc
DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Pass: ${REDIS_PASS}
    Type: node
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
UserRPC:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000
TagRPC:
  Endpoints:
    - 127.0.0.1:8084
  NonBlock: true
  Timeout: 5000
