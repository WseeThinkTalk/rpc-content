syntax = "proto3";

package content;
option go_package = "api-thinktalk/client/article/pb;pb";

service Article {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Articles(ArticlesRequest) returns (ArticlesResponse);
  rpc ArticleDelete(ArticleDeleteRequest) returns (ArticleDeleteResponse);
  rpc ArticleDetail(ArticleDetailRequest) returns (ArticleDetailResponse);
  rpc SearchArticles(SearchRequest) returns (SearchResponse);
  rpc AdminPendingList(AdminPendingListRequest) returns (AdminPendingListResponse);
  rpc AdminAudit(AdminAuditRequest) returns (AdminAuditResponse);
}

message PublishRequest {
  int64 userId = 1;
  string title = 2;
  string content = 3;
  string description = 4;
  string cover = 5;
  repeated int64 tagIds = 6;
}

message PublishData {
  int64 articleId = 1;
}

message PublishResponse {
  int64 code = 1;
  string msg = 2;
  PublishData data = 3;
}

message ArticlesRequest {
  int64 userId = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
  int32 sortType = 4;
  int64 articleId = 5;
}

message ArticleItem {
  int64 id = 1;
  string title = 2;
  string content = 3;
  string description = 4;
  string cover = 5;
  int64 commentCount = 6;
  int64 likeCount = 7;
  int64 publishTime = 8;
  int64 authorId = 9;
  int64 status = 10;
}

message ArticlesData {
  repeated ArticleItem articles = 1;
  bool isEnd = 2;
  int64 cursor = 3;
  int64 articleId = 4;
}

message ArticlesResponse {
  int64 code = 1;
  string msg = 2;
  ArticlesData data = 3;
}

message ArticleDeleteRequest {
  int64 userId = 1;
  int64 articleId = 2;
}

message ArticleDeleteResponse {
  int64 code = 1;
  string msg = 2;
}

message ArticleDetailRequest {
  int64 articleId = 1;
}

message ArticleDetailResponse {
  int64 code = 1;
  string msg = 2;
  ArticleItem data = 3;
}

message SearchRequest {
  string keyword = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
  int32 sortType = 4;
}

message SearchItem {
  int64 articleId = 1;
  string title = 2;
  string description = 3;
  string cover = 4;
  int64 authorId = 5;
  string authorName = 6;
  int64 likeNum = 7;
  int64 commentNum = 8;
  string publishTime = 9;
  string authorAvatar = 10;
}

message SearchData {
  repeated SearchItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message SearchResponse {
  int64 code = 1;
  string msg = 2;
  SearchData data = 3;
}

message AdminPendingListRequest {
  int64 cursor = 1;
  int64 pageSize = 2;
}

message AdminPendingListResponse {
  int64 code = 1;
  string msg = 2;
  SearchData data = 3;
}

message AdminAuditRequest {
  int64 articleId = 1;
  int32 status = 2;
}

message AdminAuditResponse {
  int64 code = 1;
  string msg = 2;
}
